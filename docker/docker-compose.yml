services:
  rentacar_db_service:
    image: postgres
    container_name: rentacar_db_service
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rentacar
      POSTGRES_DB: rentacar
    ports:
      - '54321:5432'
    volumes:
      - rentacar_db_data:/var/lib/postgresql/data

volumes:
  rentacar_db_data:
